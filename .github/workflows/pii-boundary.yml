name: PII Boundary Scan

# Scan PR diff for private-project context (organization names, partner
# names, internal project codenames) that must not appear in this public
# repo. Uses a separate public action that takes the deny-list at runtime
# from a repo secret — the rules themselves never enter any repo's tree.
#
# Why: a prior release shipped private-context strings to this public
# repo. An earlier PR attempted an in-repo lint but the deny-list IS
# the leak, so it was reverted to the operator's local environment.
# This workflow restores the protection via reusable action — scanner
# logic is public (auditable), deny-list lives in a repo secret.
#
# Setup: set repo secret PERSONAL_BOUNDARY_DENY_LIST to the YAML deny-list
# content. See https://github.com/Imbad0202/personal-boundary-action for
# the schema and security model.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pii-boundary-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deny-list availability
        id: probe
        env:
          DENY_PRESENT: ${{ secrets.PERSONAL_BOUNDARY_DENY_LIST != '' }}
        run: |
          if [ "$DENY_PRESENT" = "true" ]; then
            echo "has_deny_list=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deny_list=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PERSONAL_BOUNDARY_DENY_LIST secret not set — boundary scan skipped."
            echo "::notice::Configure under Settings → Secrets and variables → Actions to enable."
          fi

      - name: Check out PR
        if: steps.probe.outputs.has_deny_list == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR diff for boundary terms
        if: steps.probe.outputs.has_deny_list == 'true'
        uses: Imbad0202/personal-boundary-action@v1
        with:
          deny-list: ${{ secrets.PERSONAL_BOUNDARY_DENY_LIST }}
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-match: 'true'
